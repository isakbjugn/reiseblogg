[package]
name = "reiseblogg"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"

[dependencies]
axum = { version = "0.8.9", features = ["form"] }
chrono = "0.4"
dotenvy = "0.15.7"
governor = "0.6"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls-tls"] }
minijinja = { version = "2.22.0", features = ["loader"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
rand = "0.10.1"
resend-rs = { version = "0.32.0", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "fs", "set-header"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
